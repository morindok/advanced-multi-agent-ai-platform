<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warlords of the Three Kingdoms</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #000; 
            color: #fff;
            user-select: none;
        }
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }
        .vital-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            min-width: 250px;
        }
        .bar-container {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            background: #4CAF50;
            transition: width 0.2s ease-out;
        }
        .bar-fill.musou { background: #FFD700; }
        .bar-fill.stamina { background: #2196F3; }
        .bar-label {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 8px;
            line-height: 12px;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .status-box {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
        }
        .stat-label {
            font-size: 10px;
            color: #aaa;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
        }
        
        #minimap {
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .minimap-marker {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
        }
        .minimap-player {
            background: #00ff00;
            width: 6px;
            height: 6px;
            z-index: 2;
        }
        .minimap-enemy {
            background: #ff0000;
        }
        .minimap-boss {
            background: #ffaa00;
            width: 8px;
            height: 8px;
        }

        #skills {
            display: flex;
            gap: 10px;
        }
        .skill-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s;
        }
        .skill-slot.active {
            border-color: #FFD700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .skill-icon {
            font-size: 24px;
        }
        .skill-key {
            position: absolute;
            bottom: 4px;
            font-size: 10px;
            color: #aaa;
        }
        .skill-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(0, 0, 0, 0.7);
            pointer-events: none;
        }

        #combo-display {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px #000;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
        }

        #menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .title {
            font-size: 64px;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 40px;
            font-family: 'Georgia', serif;
            letter-spacing: 5px;
        }
        .menu-btn {
            background: linear-gradient(135deg, #444 0%, #222 100%);
            border: 1px solid #FFD700;
            color: #fff;
            padding: 15px 40px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s;
            min-width: 250px;
        }
        .menu-btn:hover {
            background: linear-gradient(135deg, #555 0%, #333 100%);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }
        .hero-select-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 800px;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .hero-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            padding: 15px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            text-align: center;
        }
        .hero-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #FFD700;
        }
        .hero-card.selected {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.2);
        }
        .hero-portrait {
            width: 80px;
            height: 80px;
            background: #333;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .hero-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .hero-faction {
            font-size: 12px;
            color: #aaa;
        }
        .hero-stats {
            font-size: 10px;
            color: #ddd;
            margin-top: 10px;
            line-height: 1.4;
        }
        .back-btn {
            margin-top: 20px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 14px;
        }
        .back-btn:hover { color: #fff; }

        #victory-overlay, #defeat-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .result-text {
            font-size: 80px;
            margin-bottom: 30px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .result-stats {
            font-size: 20px;
            margin-bottom: 40px;
            color: #ccc;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="hud" style="display: none;">
        <div class="hud-top">
            <div class="vital-stats">
                <div>
                    <div class="bar-container" style="margin-bottom: 4px;">
                        <div class="bar-fill" id="hp-bar"></div>
                        <span class="bar-label">HEALTH</span>
                    </div>
                </div>
                <div>
                    <div class="bar-container" style="margin-bottom: 4px;">
                        <div class="bar-fill musou" id="musou-bar" style="width: 0%"></div>
                        <span class="bar-label">MUSOU</span>
                    </div>
                </div>
                <div>
                    <div class="bar-container">
                        <div class="bar-fill stamina" id="stamina-bar"></div>
                        <span class="bar-label">STAMINA</span>
                    </div>
                </div>
            </div>
            
            <div class="status-box">
                <div class="stat-item">
                    <div>
                        <div class="stat-label">KOs</div>
                        <div class="stat-value" id="ko-counter">0</div>
                    </div>
                    <div style="font-size: 24px;">💀</div>
                </div>
                <div class="stat-item">
                    <div>
                        <div class="stat-label">TIME</div>
                        <div class="stat-value" id="timer">0:00</div>
                    </div>
                    <div style="font-size: 24px;">⏱️</div>
                </div>
            </div>
        </div>
        
        <div class="hud-bottom">
            <div id="minimap">
                <!-- Markers added by JS -->
            </div>
            
            <div id="skills">
                <div class="skill-slot" id="skill-1">
                    <div class="skill-icon">⚔️</div>
                    <div class="skill-key">J</div>
                    <div class="skill-cooldown" id="cd-1"></div>
                </div>
                <div class="skill-slot" id="skill-2">
                    <div class="skill-icon">💥</div>
                    <div class="skill-key">K</div>
                    <div class="skill-cooldown" id="cd-2"></div>
                </div>
                <div class="skill-slot" id="skill-3">
                    <div class="skill-icon">🏇</div>
                    <div class="skill-key">L</div>
                    <div class="skill-cooldown" id="cd-3"></div>
                </div>
            </div>
        </div>
        
        <div id="combo-display">COMBO: 0</div>
        <div id="damage-overlay"></div>
    </div>

    <div id="menu-overlay">
        <div class="main-menu">
            <div class="title">WARLORDS</div>
            <button class="menu-btn" id="btn-start">START MISSION</button>
            <button class="menu-btn" id="btn-exit" style="margin-top: 20px;">EXIT</button>
        </div>
        
        <div class="hero-select-container" id="hero-select" style="display: none;">
            <div style="font-size: 32px; margin-bottom: 10px;">CHOOSE YOUR WARLORD</div>
            <div class="hero-grid" id="hero-grid"></div>
            <button class="back-btn" id="btn-back">← Back to Menu</button>
            <button class="menu-btn" id="btn-confirm-hero" style="margin-top: 20px; display: none;">CONFIRM SELECTION</button>
        </div>
    </div>
    
    <div id="victory-overlay">
        <div class="result-text" style="color: #FFD700;">VICTORY</div>
        <div class="result-stats" id="victory-stats"></div>
        <button class="menu-btn" id="btn-restart">PLAY AGAIN</button>
    </div>
    
    <div id="defeat-overlay">
        <div class="result-text" style="color: #ff4444;">DEFEAT</div>
        <div class="result-stats" id="defeat-stats"></div>
        <button class="menu-btn" id="btn-retry">TRY AGAIN</button>
    </div>

    <script>
        // ==========================================
        // CONSTANTS & CONFIG
        // ==========================================
        const CONFIG = {
            FIELD_SIZE: 200,
            ENEMY_COUNT: 300,
            ATTACK_COMBO_LENGTH: 6,
            MUSOU_DAMAGE: 100,
            GRAVITY: 9.8
        };

        // ==========================================
        // CLASSES
        // ==========================================
        
        class InputManager {
            constructor() {
                this.keys = {};
                this.mouse = { x: 0, y: 0, left: false, right: false };
                this.touch = { x: 0, y: 0, active: false };
                this.bindEvents();
            }

            bindEvents() {
                window.addEventListener('keydown', e => this.keys[e.code] = true);
                window.addEventListener('keyup', e => this.keys[e.code] = false);
                
                window.addEventListener('mousemove', e => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });
                window.addEventListener('mousedown', e => {
                    if(e.button === 0) this.mouse.left = true;
                    if(e.button === 2) this.mouse.right = true;
                });
                window.addEventListener('mouseup', e => {
                    if(e.button === 0) this.mouse.left = false;
                    if(e.button === 2) this.mouse.right = false;
                });
                window.addEventListener('contextmenu', e => e.preventDefault());

                // Touch controls
                window.addEventListener('touchstart', e => {
                    if(e.touches.length > 0) {
                        this.touch.x = e.touches[0].clientX;
                        this.touch.y = e.touches[0].clientY;
                        this.touch.active = true;
                    }
                }, {passive: false});
                window.addEventListener('touchmove', e => {
                    if(e.touches.length > 0) {
                        this.touch.x = e.touches[0].clientX;
                        this.touch.y = e.touches[0].clientY;
                    }
                }, {passive: false});
                window.addEventListener('touchend', e => {
                    this.touch.active = false;
                });
            }

            isPressed(code) { return !!this.keys[code]; }
            getAxis() {
                let x = 0, y = 0;
                if (this.isPressed('KeyW') || this.isPressed('ArrowUp')) y += 1;
                if (this.isPressed('KeyS') || this.isPressed('ArrowDown')) y -= 1;
                if (this.isPressed('KeyA') || this.isPressed('ArrowLeft')) x -= 1;
                if (this.isPressed('KeyD') || this.isPressed('ArrowRight')) x += 1;
                
                // Normalize
                const len = Math.sqrt(x*x + y*y);
                if(len > 1) { x/=len; y/=len; }
                
                // Touch override
                if(this.touch.active) {
                    x = (this.touch.x - window.innerWidth/2) / 200;
                    y = -(this.touch.y - window.innerHeight/2) / 200;
                }
                return {x, y};
            }
        }

        class AudioManager {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.5;
                this.masterGain.connect(this.ctx.destination);
            }

            playHit() {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.masterGain);
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playKOSound() {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.masterGain);
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        class Hero {
            constructor(data) {
                this.name = data.name;
                this.faction = data.faction;
                this.hp = data.hp || 100;
                this.maxHp = data.hp || 100;
                this.musou = 0;
                this.stamina = 100;
                this.maxStamina = 100;
                this.speed = data.speed || 5;
                this.damage = data.damage || 10;
                this.kos = 0;
                this.combo = 0;
                this.lastComboTime = 0;
            }
        }

        class Enemy {
            constructor(position, type = 'grunt') {
                this.position = new THREE.Vector3(...position);
                this.type = type;
                this.hp = type === 'elite' ? 50 : type === 'boss' ? 200 : 20;
                this.maxHp = this.hp;
                this.speed = type === 'cavalry' ? 6 : 2;
                this.attackRange = 2.5;
                this.attackCooldown = 0;
                this.active = true;
                this.staggerTimer = 0;
                
                // Visual mesh will be created in render step
                this.mesh = null;
            }

            update(delta, playerPos, hero) {
                if(!this.active) return;

                if(this.staggerTimer > 0) {
                    this.staggerTimer -= delta;
                    if(this.staggerTimer <= 0) this.staggerTimer = 0;
                    return;
                }

                this.attackCooldown -= delta;

                const dirToPlayer = new THREE.Vector3().subVectors(playerPos, this.position);
                const dist = dirToPlayer.length();

                if(dist < this.attackRange && this.attackCooldown <= 0) {
                    // Attack
                    this.attackCooldown = 1.5;
                    if(hero.takeDamage(2)) {
                        // Player took damage
                    }
                } else {
                    // Move
                    if(this.type === 'cavalry') {
                        // Charge behavior
                        if(dist > 15 && dist < 50) {
                            this.position.add(dirToPlayer.normalize().multiplyScalar(this.speed * 2 * delta));
                        }
                    } else {
                        if(dist > this.attackRange * 0.8) {
                            this.position.add(dirToPlayer.normalize().multiplyScalar(this.speed * delta));
                        } else if(dist < this.attackRange * 0.5) {
                            // Push back
                            this.position.add(dirToPlayer.normalize().multiplyScalar(-1 * delta));
                        }
                    }
                }

                // Update mesh
                if(this.mesh) {
                    this.mesh.position.copy(this.position);
                }
            }

            takeDamage(amount, isCrit = false) {
                this.hp -= amount;
                if(this.hp <= 0) {
                    this.active = false;
                    return true; // KO'd
                }
                this.staggerTimer = 0.2;
                return false;
            }
        }

        // ==========================================
        // GAME ENGINE
        // ==========================================
        const Game = {
            scene: null,
            camera: null,
            renderer: null,
            input: new InputManager(),
            audio: null,
            hero: null,
            enemies: [],
            enemyMeshes: [],
            playerMesh: null,
            ground: null,
            
            // State
            state: 'MENU', // MENU, PLAYING, PAUSED, GAME_OVER
            clock: new THREE.Clock(),
            animTime: 0,
            isAttacking: false,
            attackCombo: 0,
            comboDisplayTimeout: 0,
            musoActive: false,
            musoTimer: 0,
            isHorseMode: false,
            
            // UI Elements
            ui: {
                hpBar: document.getElementById('hp-bar'),
                musouBar: document.getElementById('musou-bar'),
                staminaBar: document.getElementById('stamina-bar'),
                koCounter: document.getElementById('ko-counter'),
                timer: document.getElementById('timer'),
                comboDisplay: document.getElementById('combo-display'),
                damageOverlay: document.getElementById('damage-overlay'),
                menuOverlay: document.getElementById('menu-overlay'),
                mainMenu: document.querySelector('.main-menu'),
                heroSelect: document.getElementById('hero-select'),
                heroGrid: document.getElementById('hero-grid'),
                btnStart: document.getElementById('btn-start'),
                btnBack: document.getElementById('btn-back'),
                btnConfirmHero: document.getElementById('btn-confirm-hero'),
                victoryOverlay: document.getElementById('victory-overlay'),
                defeatOverlay: document.getElementById('defeat-overlay'),
                victoryStats: document.getElementById('victory-stats'),
                defeatStats: document.getElementById('defeat-stats'),
                btnRestart: document.getElementById('btn-restart'),
                btnRetry: document.getElementById('btn-retry'),
                minimap: document.getElementById('minimap'),
                skillSlots: [document.getElementById('skill-1'), document.getElementById('skill-2'), document.getElementById('skill-3')],
                cooldowns: [document.getElementById('cd-1'), document.getElementById('cd-2'), document.getElementById('cd-3')]
            },

            selectedHeroData: null,
            gameTime: 0,

            init() {
                this.audio = new AudioManager();
                this.initGraphics();
                this.createUI();
                this.bindMenuEvents();
                this.animate();
            },

            initGraphics() {
                // Renderer
                const canvas = document.getElementById('game-canvas');
                this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87CEEB); // Sky blue
                this.scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

                // Camera
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 10, 20);

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffee, 1.5);
                dirLight.position.set(50, 100, 50);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.set(2048, 2048);
                this.scene.add(dirLight);

                // Ground
                this.createGround();
                
                // Obstacles (Walls/Towers for atmosphere)
                this.createObstacles();

                // Resize handler
                window.addEventListener('resize', () => this.onResize());
            },

            createGround() {
                const groundGeo = new THREE.PlaneGeometry(CONFIG.FIELD_SIZE, CONFIG.FIELD_SIZE, 50, 50);
                const groundMat = new THREE.MeshStandardMaterial({ 
                    color: 0x3d7344, 
                    roughness: 0.8,
                    metalness: 0.0
                });
                this.ground = new THREE.Mesh(groundGeo, groundMat);
                this.ground.rotation.x = -Math.PI / 2;
                this.ground.receiveShadow = true;
                this.scene.add(this.ground);

                // Grid helper for visual reference
                const grid = new THREE.GridHelper(CONFIG.FIELD_SIZE, 20, 0x000000, 0x000000);
                grid.material.opacity = 0.1;
                grid.material.transparent = true;
                this.scene.add(grid);
            },

            createObstacles() {
                // Add some simple structures
                const boxGeo = new THREE.BoxGeometry(2, 10, 2);
                const boxMat = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                
                for(let i=0; i<10; i++) {
                    const obs = new THREE.Mesh(boxGeo, boxMat);
                    obs.position.set(
                        (Math.random() - 0.5) * 150,
                        5,
                        (Math.random() - 0.5) * 150
                    );
                    obs.castShadow = true;
                    this.scene.add(obs);
                }
            },

            createPlayerMesh(heroData) {
                if(this.playerMesh) this.scene.remove(this.playerMesh);
                
                const group = new THREE.Group();
                
                // Body
                const bodyGeo = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: heroData.color || 0x0000FF });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1;
                body.castShadow = true;
                group.add(body);

                // Head
                const headGeo = new THREE.SphereGeometry(0.4, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xFFE0BD });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 2.2;
                head.castShadow = true;
                group.add(head);

                // Weapon (simple box for now)
                const weaponGeo = new THREE.BoxGeometry(0.2, 1.5, 0.2);
                const weaponMat = new THREE.MeshStandardMaterial({ color: 0xCCCCCC });
                const weapon = new THREE.Mesh(weaponGeo, weaponMat);
                weapon.position.set(0.6, 1.5, 0);
                weapon.rotation.z = 0.5;
                group.add(weapon);

                this.playerMesh = group;
                this.playerMesh.position.set(0, 0, 0);
                this.scene.add(this.playerMesh);
                
                // Initialize Enemy Meshes
                this.initEnemyVisuals();
            },

            initEnemyVisuals() {
                // Clear existing
                this.enemyMeshes.forEach(m => { if(m.parent) m.parent.remove(m); });
                this.enemyMeshes = [];

                // Create InstancedMesh for grunts for performance
                const gruntGeo = new THREE.ConeGeometry(0.5, 1.5, 8);
                const gruntMat = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
                const gruntMesh = new THREE.InstancedMesh(gruntGeo, gruntMat, 1000);
                gruntMesh.castShadow = true;
                this.scene.add(gruntMesh);
                this.gruntInstancedMesh = gruntMesh;
                this.gruntInstanceCount = 0;

                // Individual meshes for elites/bosses
                this.eliteGroup = new THREE.Group();
                this.scene.add(this.eliteGroup);
                this.eliteMeshes = [];
            },

            spawnEnemies() {
                this.enemies = [];
                const radius = 40;
                
                for(let i = 0; i < CONFIG.ENEMY_COUNT; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * radius + 10;
                    const x = Math.cos(angle) * dist;
                    const z = Math.sin(angle) * dist;
                    
                    // Determine type
                    let type = 'grunt';
                    const roll = Math.random();
                    if(roll > 0.95) type = 'boss';
                    else if(roll > 0.8) type = 'elite';
                    else if(roll > 0.6) type = 'cavalry';

                    this.enemies.push(new Enemy([x, 0, z], type));
                }
            },

            updateEnemyVisuals() {
                // Update Instanced Grunts
                let gruntIdx = 0;
                const dummy = new THREE.Object3D();
                
                for(let i=0; i < this.enemies.length; i++) {
                    const e = this.enemies[i];
                    if(e.active) {
                        if(e.type === 'grunt' || e.type === 'cavalry') {
                            dummy.position.copy(e.position);
                            dummy.position.y = e.type === 'cavalry' ? 2 : 0.75;
                            dummy.updateMatrix();
                            this.gruntInstancedMesh.setMatrixAt(gruntIdx, dummy.matrix);
                            gruntIdx++;
                        } else {
                            // Elite or Boss
                            if(!e.mesh) {
                                const geo = new THREE.ConeGeometry(0.8, 2, 8);
                                const mat = new THREE.MeshStandardMaterial({ color: e.type === 'boss' ? 0xff0000 : 0xffff00 });
                                e.mesh = new THREE.Mesh(geo, mat);
                                e.mesh.castShadow = true;
                                this.eliteGroup.add(e.mesh);
                            }
                            e.mesh.position.copy(e.position);
                            e.mesh.position.y = 1;
                        }
                    }
                }
                
                this.gruntInstancedMesh.count = gruntIdx;
                this.gruntInstancedMesh.instanceMatrix.needsUpdate = true;
                
                // Update Minimap
                this.updateMinimap();
            },

            updateMinimap() {
                // Clear old markers (keep simple, remove non-player markers)
                const markers = this.ui.minimap.querySelectorAll('.minimap-marker:not(.minimap-player)');
                markers.forEach(m => m.remove());

                const scale = 180 / CONFIG.FIELD_SIZE; // Minimap is 180px, Field is 200 units
                const cx = 90; // Center
                const cz = 90;

                // Boss/Elite markers
                for(let i=0; i<this.enemies.length; i++) {
                    const e = this.enemies[i];
                    if(e.active && (e.type === 'elite' || e.type === 'boss')) {
                        const marker = document.createElement('div');
                        marker.className = `minimap-marker minimap-${e.type}`;
                        const x = cx + e.position.x * scale;
                        const y = cz + e.position.z * scale;
                        marker.style.left = `${x}px`;
                        marker.style.top = `${y}px`;
                        this.ui.minimap.appendChild(marker);
                    }
                }
                
                // Player marker
                let playerMarker = this.ui.minimap.querySelector('.minimap-player');
                if(!playerMarker) {
                    playerMarker = document.createElement('div');
                    playerMarker.className = 'minimap-marker minimap-player';
                    this.ui.minimap.appendChild(playerMarker);
                }
                const px = cx + this.playerMesh.position.x * scale;
                const pz = cz + this.playerMesh.position.z * scale;
                playerMarker.style.left = `${px}px`;
                playerMarker.style.top = `${pz}px`;
            },
