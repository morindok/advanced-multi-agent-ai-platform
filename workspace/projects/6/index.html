<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncNote — یادداشت‌بردار هوشمند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-primary: #0f0f14;
  --bg-secondary: #1a1a24;
  --bg-tertiary: #232330;
  --bg-elevated: #2a2a3a;
  --bg-hover: #32324a;
  --bg-active: #3a3a55;
  --accent: #7c5cfc;
  --accent-light: #9b82fc;
  --accent-dark: #5a3de6;
  --accent-glow: rgba(124, 92, 252, 0.25);
  --text-primary: #f0f0f8;
  --text-secondary: #a0a0c0;
  --text-muted: #6a6a8a;
  --border: #2e2e42;
  --border-light: #3a3a52;
  --success: #34d399;
  --success-bg: rgba(52, 211, 153, 0.12);
  --warning: #fbbf24;
  --warning-bg: rgba(251, 191, 36, 0.12);
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.12);
  --info: #60a5fa;
  --info-bg: rgba(96, 165, 250, 0.12);
  --sidebar-width: 280px;
  --toolbar-height: 48px;
  --header-height: 56px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

html, body {
  height: 100%;
  font-family: 'Vazirmatn', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  overflow: hidden;
  font-size: 14px;
  line-height: 1.6;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── App Layout ── */
.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform var(--transition);
  z-index: 100;
}

.sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 15px var(--accent-glow);
}

.logo-text {
  font-size: 18px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}

.search-box {
  position: relative;
}

.search-box input {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 12px 8px 34px;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

.search-box input::placeholder { color: var(--text-muted); }
.search-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
  pointer-events: none;
}

.sidebar-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.btn-new-note {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white;
  border: none;
  border-radius: var(--radius-md);
  padding: 8px 14px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 4px 15px var(--accent-glow);
}

.btn-new-note:hover {
  opacity: 0.9;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px var(--accent-glow);
}

.btn-new-note:active { transform: translateY(0); }

.sidebar-tags {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex-shrink: 0;
}

.tag-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  transition: all var(--transition);
}

.tag-btn:hover, .tag-btn.active {
  background: var(--accent-glow);
  border-color: var(--accent);
  color: var(--accent-light);
}

.note-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.note-card {
  padding: 12px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  margin-bottom: 4px;
  transition: background var(--transition);
  border: 1px solid transparent;
  position: relative;
}

.note-card:hover { background: var(--bg-tertiary); }

.note-card.active {
  background: var(--bg-elevated);
  border-color: var(--accent);
  box-shadow: 0 2px 12px var(--accent-glow);
}

.note-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 6px;
}

.note-card-excerpt {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 6px;
}

.note-card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.note-card-date {
  font-size: 10px;
  color: var(--text-muted);
}

.note-card-sync {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  flex-shrink: 0;
}

.note-card-delete {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--danger-bg);
  border: none;
  color: var(--danger);
  width: 22px;
  height: 22px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 11px;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
}

.note-card:hover .note-card-delete { display: flex; }
.note-card-delete:hover { background: var(--danger); color: white; }

/* ── Main Area ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-primary);
}

.main-header {
  height: var(--header-height);
  min-height: var(--header-height);
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.menu-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
}

.folder-breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

.breadcrumb-item {
  color: var(--text-secondary);
  cursor: pointer;
  transition: color var(--transition);
}

.breadcrumb-item:hover { color: var(--accent-light); }
.breadcrumb-sep { color: var(--text-muted); }

.header-actions {
  margin-right: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-btn {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 4px;
}

.header-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-light);
}

.sync-status {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
}

.sync-status.synced { background: var(--success-bg); color: var(--success); }
.sync-status.syncing { background: var(--info-bg); color: var(--info); }
.sync-status.error { background: var(--danger-bg); color: var(--danger); }
.sync-status.unsaved { background: var(--warning-bg); color: var(--warning); }

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* ── Editor Area ── */
.editor-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.editor-toolbar {
  height: var(--toolbar-height);
  min-height: var(--toolbar-height);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 6px;
  border-right: 1px solid var(--border);
}

.toolbar-group:last-child { border-right: none; }

.tool-btn {
  background: none;
  border: none;
  color: var(--text-secondary);
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all var(--transition);
  font-family: inherit;
}

.tool-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
.tool-btn.active { background: var(--accent-glow); color: var(--accent-light); }

.tool-select {
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  outline: none;
  transition: all var(--transition);
}

.tool-select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.editor-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

.editor-inner {
  max-width: 820px;
  margin: 0 auto;
  padding: 32px 40px 120px;
}

.note-title-input {
  width: 100%;
  background: none;
  border: none;
  font-size: 28px;
  font-weight: 800;
  color: var(--text-primary);
  font-family: inherit;
  outline: none;
  margin-bottom: 8px;
  line-height: 1.3;
  letter-spacing: -0.5px;
}

.note-title-input::placeholder { color: var(--text-muted); }

.note-meta-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--text-muted);
}

.meta-item span { color: var(--text-secondary); }

.tag-input-container {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 8px;
  flex-wrap: wrap;
}

.tag-chip {
  background: var(--accent-glow);
  color: var(--accent-light);
  border: 1px solid rgba(124, 92, 252, 0.3);
  border-radius: 12px;
  padding: 1px 8px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.tag-chip-remove {
  cursor: pointer;
  font-size: 10px;
  opacity: 0.7;
  transition: opacity var(--transition);
}

.tag-chip-remove:hover { opacity: 1; }

.tag-input {
  background: none;
  border: none;
  color: var(--text-primary);
  font-family: inherit;
  font-size: 12px;
  outline: none;
  min-width: 60px;
}

.tag-input::placeholder { color: var(--text-muted); }

.editor-content {
  min-height: 400px;
  outline: none;
  font-size: 15px;
  line-height: 1.8;
  color: var(--text-primary);
  font-family: inherit;
}

.editor-content:empty::before {
  content: 'شروع به نوشتن کنید...';
  color: var(--text-muted);
}

.editor-content h1 { font-size: 26px; font-weight: 800; margin: 24px 0 12px; color: var(--text-primary); }
.editor-content h2 { font-size: 21px; font-weight: 700; margin: 20px 0 10px; color: var(--text-primary); }
.editor-content h3 { font-size: 17px; font-weight: 700; margin: 16px 0 8px; color: var(--text-primary); }
.editor-content p { margin-bottom: 10px; }
.editor-content ul { padding-right: 20px; margin-bottom: 10px; }
.editor-content ol { padding-right: 24px; margin-bottom: 10px; }
.editor-content li { margin-bottom: 4px; }
.editor-content blockquote {
  border-right: 3px solid var(--accent);
  padding: 8px 16px;
  margin: 12px 0;
  background: var(--bg-tertiary);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-secondary);
  font-style: italic;
}
.editor-content code {
  background: var(--bg-elevated);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
  font-family: 'Courier New', monospace;
  color: var(--accent-light);
}
.editor-content pre {
  background: var(--bg-elevated);
  padding: 16px;
  border-radius: var(--radius-md);
  overflow-x: auto;
  margin: 12px 0;
}
.editor-content pre code { background: none; padding: 0; }
.editor-content a { color: var(--accent-light); }
.editor-content hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 20px 0;
}
.editor-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
}
.editor-content th, .editor-content td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: right;
}
.editor-content th { background: var(--bg-tertiary); font-weight: 600; }

/* ── Empty State ── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px;
}

.empty-icon {
  width: 80px;
  height: 80px;
  background: var(--bg-elevated);
  border-radius: var(--radius-xl);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  box-shadow: var(--shadow-md);
}

.empty-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

.empty-desc {
  font-size: 14px;
  color: var(--text-muted);
  text-align: center;
  max-width: 300px;
  line-height: 1.7;
}

.empty-shortcut {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 12px;
}

.kbd {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  font-family: inherit;
  color: var(--text-secondary);
}

/* ── Toast Notifications ── */
.toast-container {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text-primary);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
  animation: toastIn 0.3s ease forwards;
  max-width: 320px;
}

.toast.leaving { animation: toastOut 0.3s ease forwards; }
.toast-success { border-color: var(--success); }
.toast-error { border-color: var(--danger); }
.toast-info { border-color: var(--info); }
.toast-warning { border-color: var(--warning); }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(20px); }
}

/* ── Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  max-width: 480px;
  width: 100%;
  animation: modalIn 0.25s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-sm);
  transition: all var(--transition);
}

.modal-close:hover { background: var(--bg-tertiary); color: var(--text-primary); }

.modal-body { padding: 20px; }
.modal-footer {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: flex-start;
  gap: 8px;
}

.btn {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.btn-primary:hover { background: var(--accent-light); border-color: var(--accent-light); }

.btn-secondary {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
}

.btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }

.btn-danger {
  background: var(--danger-bg);
  border-color: var(--danger);
  color: var(--danger);
}

.btn-danger:hover { background: var(--danger); color: white; }

/* ── Sidebar Footer ── */
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.stats-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.storage-bar {
  height: 3px;
  background: var(--bg-elevated);
  border-radius: 2px;
  overflow: hidden;
}

.storage-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* ── Word Count Bar ── */
.status-bar {
  height: 28px;
  min-height: 28px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.status-item { display: flex; align-items: center; gap: 4px; }

/* ── Responsive ── */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    right: 0;
    top: 0;
    height: 100%;
    transform: translateX(100%);
    box-shadow: var(--shadow-lg);
  }

  .sidebar.open { transform: translateX(0); }

  .menu-toggle { display: flex; }

  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
    display: none;
  }

  .sidebar-overlay.open { display: block; }

  .editor-inner { padding: 20px 16px 100px; }
  .note-title-input { font-size: 22px; }
}

/* ── Animations ── */
.fade-in { animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ── Print ── */
@media print {
  .sidebar, .editor-toolbar, .status-bar, .main-header { display: none !important; }
  .main { margin: 0; }
  .editor-inner { padding: 0; }
  body { background: white; color: black; }
}
</style>
</head>
<body>

<div class="app">
  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">📝</div>
        <div class="logo-text">SyncNote</div>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="جستجو در یادداشت‌ها..." autocomplete="off">
      </div>
      <div class="sidebar-actions">
        <button class="btn-new-note" id="btnNewNote">
          <span>+</span>
          <span>یادداشت جدید</span>
        </button>
      </div>
    </div>

    <div class="sidebar-tags" id="tagFilterBar">
      <button class="tag-btn active" data-tag="all">همه</button>
    </div>

    <div class="note-list" id="noteList"></div>

    <div class="sidebar-footer">
      <div class="stats-row">
        <span id="noteCount">۰ یادداشت</span>
        <span id="storageInfo">۰ بایت</span>
      </div>
      <div class="storage-bar">
        <div class="storage-fill" id="storageFill" style="width:0%"></div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <header class="main-header">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="folder-breadcrumb" id="breadcrumb">
        <span class="breadcrumb-item">یادداشت‌ها</span>
      </div>
      <div class="header-actions">
        <div class="sync-status synced" id="syncStatus">
          <div class="sync-dot"></div>
          <span id="syncText">همگام‌شده</span>
        </div>
        <button class="header-btn" id="btnExport" title="خروجی گرفتن">📤 خروجی</button>
        <button class="header-btn" id="btnImport" title="ورود داده">📥 ورودی</button>
        <button class="header-btn" id="btnSettings" title="تنظیمات">⚙️</button>
      </div>
    </header>

    <div class="editor-container" id="editorContainer">
      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📝</div>
        <div class="empty-title">به SyncNote خوش آمدید</div>
        <div class="empty-desc">یک یادداشت جدید بسازید یا از یادداشت‌های موجود ویرایش کنید.</div>
        <div class="empty-shortcut">
          <span class="kbd">Ctrl</span><span>+</span><span class="kbd">N</span>
          <span>یادداشت جدید</span>
        </div>
        <div class="empty-shortcut">
          <span class="kbd">Ctrl</span><span>+</span><span class="kbd">S</span>
          <span>ذخیره سریع</span>
        </div>
      </div>

      <!-- Editor (hidden initially) -->
      <div class="editor-scroll fade-in" id="editorScroll" style="display:none;">
        <div class="editor-inner">
          <input
            type="text"
            class="note-title-input"
            id="noteTitle"
            placeholder="عنوان یادداشت..."
            autocomplete="off"
          >

          <div class="note-meta-bar">
            <div class="meta-item">
              🕐 <span id="noteDate">—</span>
            </div>
            <div class="meta-item">
              ✏️ <span id="noteModified">—</span>
            </div>
            <div class="meta-item" style="margin-right:auto;">
              <span>برچسب‌ها:</span>
              <div class="tag-input-container" id="tagContainer">
                <input type="text" class="tag-input" id="tagInput" placeholder="برچسب + Enter">
              </div>
            </div>
          </div>

          <div class="editor-toolbar">
            <div class="toolbar-group">
              <select class="tool-select" id="formatHeading" title="سرفصل">
                <option value="">پاراگراف</option>
                <option value="H1">سرتیتر ۱</option>
                <option value="H2">سرتیتر ۲</option>
                <option value="H3">سرتیتر ۳</option>
              </select>
            </div>
            <div class="toolbar-group">
              <button class="tool-btn" data-cmd="bold" title="درشت (Ctrl+B)"><b>ب</b></button>
              <button class="tool-btn" data-cmd="italic" title="کج (Ctrl+I)"><i>ک</i></button>
              <button class="tool-btn" data-cmd="underline" title="زیرخط (Ctrl+U)"><u>ز</u></button>
              <button class="tool-btn" data-cmd="strikeThrough" title="خط‌خورده"><s>خ</s></s></button>
            </div>
            <div class="toolbar-group">
              <button class="tool-btn" data-cmd="justifyRight" title="راست‌چین">➡</button>
              <button class="tool-btn" data-cmd="justifyCenter" title="وسط‌چین">↔</button>
              <button class="tool-btn" data-cmd="justifyLeft" title="چپ‌چین">⬅</button>
            </div>
            <div class="toolbar-group">
              <button class="tool-btn" data-cmd="insertUnorderedList" title="لیست نقطه‌ای">•≡</button>
              <button class="tool-btn" data-cmd="insertOrderedList" title="لیست عددی">1≡</button>
            </div>
